name: elevated-potential-logic on gh-ci with temurin 17 and maven-wrapper

on:
  push:
  #pull_request:
  workflow_dispatch:
  #workflow_call:
  #workflow_run:

jobs:
  build:
    runs-on: ubuntu-latest
    # don't like this, leave as a safeguard
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B --file pom.xml test

      - name: Package with Maven
        run: ./mvnw -B -DskipTests --file pom.xml package
