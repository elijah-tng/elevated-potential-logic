name: elevated-potential on gh-ci with temurin 17 and maven-wrapper

# `workflow_dispatch` is manually triggered
# TODO: _run and _call as well

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # don't like this, leave as a safeguard
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test --file pom.xml

      - name: Package with Maven
        run: ./mvnw -B package -DskipTests --file pom.xml
